[build]
builder = "dockerfile"
dockerfilePath = "crates/mys-bridge/Dockerfile"

[deploy]
startCommand = "sh -c 'echo \"$BRIDGE_AUTHORITY_KEY\" > /tmp/bridge_key && cargo run --release --bin mys-bridge -- --config-path /app/bridge-config-validator-3.yaml'"
healthcheckPath = "/ping"
healthcheckTimeout = 300

[deploy.envVars]
PORT = "8082"

[variables]
BRIDGE_AUTHORITY_KEY = ""

# Optional: Logging configuration
RUST_LOG = "info,mys_bridge=debug"

# Database Configuration (optional for observer nodes)
# DATABASE_URL = "${{Postgres.DATABASE_URL}}"

# Bridge Node Configuration
BRIDGE_NODE_PORT = "8082"
BRIDGE_METRICS_PORT = "9092"

# Contract Addresses (Base Sepolia)
BRIDGE_COMMITTEE_ADDRESS = "0x5e99C070846e53286A9d719cf469CE71E20D2B69"
BRIDGE_CONFIG_ADDRESS = "0xfA3e23F8A8D4e46d737f8fE1E89a279C1d9dBc0d"
BRIDGE_LIMITER_ADDRESS = "0xFE78a317a7887A6017a12a5C3dbaC01DDd83884a"
BRIDGE_VAULT_ADDRESS = "0x7a752D0e532cd6D1D9edb6073EDf1920761CAC50"

# Bridge Authority Configuration
BRIDGE_COMMITTEE_MEMBER = "true"

# Network Configuration
SOURCE_CHAIN_ID = "12"  # Base Sepolia
TARGET_CHAIN_ID = "2"      # Mys Network

# Monitoring and Logging
LOG_LEVEL = "info"
METRICS_ENABLED = "true"
PROMETHEUS_PORT = "9092"

# Performance Settings
SYNC_BATCH_SIZE = "100"
SYNC_INTERVAL_MS = "5000"
MAX_CONCURRENT_REQUESTS = "10"

# Security Settings
ENABLE_CORS = "true"
TRUSTED_PROXY_COUNT = "1"

# Feature Flags
ENABLE_EMERGENCY_PAUSE = "true"
ENABLE_RATE_LIMITING = "true"
ENABLE_TRANSFER_LIMITS = "true"
