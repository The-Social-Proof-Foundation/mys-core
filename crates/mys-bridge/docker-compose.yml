version: '3.8'

services:
  # PostgreSQL Database for Bridge
  postgres:
    image: postgres:15-alpine
    container_name: myso-bridge-postgres
    environment:
      POSTGRES_DB: railway
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: KSZdWvSJKmuFrZjgjBEzdQwAogYclIgi
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    networks:
      - bridge-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bridge_user -d myso_bridge"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: myso-bridge-redis
    ports:
      - "6379:6379"
    networks:
      - bridge-network
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  # MySo Bridge Node
  bridge-node:
    build:
      context: ../../
      dockerfile: crates/mys-bridge/Dockerfile
    container_name: myso-bridge-node
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database Configuration
      DATABASE_URL: "postgresql://postgres:KSZdWvSJKmuFrZjgjBEzdQwAogYclIgi@gondola.proxy.rlwy.net:46759/railway"
      DB_POOL_SIZE: "10"
      DB_CONNECTION_TIMEOUT: "30"
      
      # Bridge Node Configuration
      MYS_RPC_URL: "https://fullnode.mainnet.sui.io:443"
      ETH_RPC_URL: "https://sepolia.base.org"
      BRIDGE_NODE_PORT: "8080"
      BRIDGE_METRICS_PORT: "9090"
      
      # Contract Addresses (Base Sepolia) - Update with your deployed addresses
      BRIDGE_CONTRACT_ADDRESS: "0x196D0E3f7b50F29531d1bd006AB3D4c2CB731DC6"
      BRIDGE_COMMITTEE_ADDRESS: "0x2e37B4ffCE8B1F00dFD7234f8D2637715A473628"
      BRIDGE_CONFIG_ADDRESS: "0x93e073F0bE555e3CAA1c9cE3e7d825496f2a5f02"
      BRIDGE_LIMITER_ADDRESS: "0x5B5691521f695c0D5743Cc7D786821b5Fda2718f"
      BRIDGE_VAULT_ADDRESS: "0xBCD346797E5DEc586B0c4Fa19b82a4E2cAd5DD67"
      
      # Bridge Authority Configuration (Replace with your private key)
      BRIDGE_AUTHORITY_KEY: ""  # Add your committee member private key
      BRIDGE_COMMITTEE_MEMBER: "true"
      
      # Network Configuration
      SOURCE_CHAIN_ID: "84532"  # Base Sepolia
      TARGET_CHAIN_ID: "1"      # Mys Network
      
      # Monitoring and Logging
      LOG_LEVEL: "info"
      RUST_LOG: "mys_bridge=info,tower_http=debug"
      METRICS_ENABLED: "true"
      PROMETHEUS_PORT: "9090"
      
      # Performance Settings
      SYNC_BATCH_SIZE: "100"
      SYNC_INTERVAL_MS: "5000"
      MAX_CONCURRENT_REQUESTS: "10"
      
      # Security Settings
      ENABLE_CORS: "true"
      TRUSTED_PROXY_COUNT: "1"
      
      # Feature Flags
      ENABLE_EMERGENCY_PAUSE: "true"
      ENABLE_RATE_LIMITING: "true"
      ENABLE_TRANSFER_LIMITS: "true"
    ports:
      - "8080:8080"  # Bridge API
      - "9090:9090"  # Metrics/Prometheus
    networks:
      - bridge-network
    volumes:
      - bridge_logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Prometheus for monitoring (optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: myso-bridge-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - bridge-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'

  # Grafana for visualization (optional)
  grafana:
    image: grafana/grafana:latest
    container_name: myso-bridge-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - bridge-network
    depends_on:
      - prometheus

networks:
  bridge-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  bridge_logs:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local 