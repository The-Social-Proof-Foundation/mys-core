[build]
builder = "dockerfile"
dockerfilePath = "crates/mys-bridge/Dockerfile"

[deploy]
startCommand = "sh -c 'echo \"$BRIDGE_AUTHORITY_KEY\" > /tmp/bridge_key && cargo run --release --bin mys-bridge -- --config-path /app/bridge-config-validator-1.yaml'"
healthcheckPath = "/metrics"
healthcheckTimeout = 300

[variables]
BRIDGE_AUTHORITY_KEY = ""

# Optional: Logging configuration
RUST_LOG = "info,mys_bridge=debug"

# Database Configuration (needed for BridgeClient)
DATABASE_URL = "${{Postgres.DATABASE_URL}}"

# The following variables are set in the static config file but can be overridden:
# MYS_RPC_URL = "https://fullnode.testnet.mysocial.network:9000"
# ETH_RPC_URL = "https://base-sepolia.g.alchemy.com/v2/dP5ANdv4tQc7ldy_stPvRTQWtO0J3KS5"
# BRIDGE_CONTRACT_ADDRESS = "0x3b80bb0443D731ee5176ec89568fDFe8eB0aAFdd"

# Bridge Node Configuration
BRIDGE_NODE_PORT = "8080"
BRIDGE_METRICS_PORT = "9090"

# Contract Addresses (Base Sepolia)
BRIDGE_COMMITTEE_ADDRESS = "0x51a483c705572E660db89F4f512A87f5A1ACB18E"
BRIDGE_CONFIG_ADDRESS = "0x96Fb55DA377cB600e6bE870fd8C9584F02CECDF5"
BRIDGE_LIMITER_ADDRESS = "0x62D1fac4FF9999e5297a848B2544Debb4216d99c"
BRIDGE_VAULT_ADDRESS = "0xD52A3F301406cAE19A36B7808a816691216E1356"

# Bridge Authority Configuration
BRIDGE_COMMITTEE_MEMBER = "true"

# Network Configuration
SOURCE_CHAIN_ID = "12"  # Base Sepolia
TARGET_CHAIN_ID = "2"      # Mys Network

# Monitoring and Logging
LOG_LEVEL = "info"
METRICS_ENABLED = "true"
PROMETHEUS_PORT = "9090"

# Performance Settings
SYNC_BATCH_SIZE = "100"
SYNC_INTERVAL_MS = "5000"
MAX_CONCURRENT_REQUESTS = "10"

# Security Settings
ENABLE_CORS = "true"
TRUSTED_PROXY_COUNT = "1"

# Feature Flags
ENABLE_EMERGENCY_PAUSE = "true"
ENABLE_RATE_LIMITING = "true"
ENABLE_TRANSFER_LIMITS = "true"
