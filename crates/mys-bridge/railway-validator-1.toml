[build]
builder = "dockerfile"
dockerfilePath = "crates/mys-bridge/Dockerfile"

[deploy]
startCommand = "sh -c 'echo \"$BRIDGE_AUTHORITY_KEY\" > /tmp/bridge_key_validator_1 && cargo run --release --bin mys-bridge -- --config-path /app/bridge-config-validator-1.yaml'"
healthcheckPath = "/ping"
healthcheckTimeout = 300

[deploy.envVars]
PORT = "8080"

[variables]
# Required: Bridge authority private key (Secp256k1) for this validator
# Must be set in Railway environment variables - do not commit to Git
BRIDGE_AUTHORITY_KEY = ""

# Optional: Logging configuration
RUST_LOG = "info,mys_bridge=debug"

# Database Configuration (needed for BridgeClient)
DATABASE_URL = "${{Postgres.DATABASE_URL}}"

# Required: Bridge configuration environment variables
# These are substituted into bridge-config-validator-1.yaml at runtime
# ETH_RPC_URL must be set (contains API keys - do not commit to Git)
ETH_RPC_URL = ""
# ETH_BRIDGE_PROXY_ADDRESS must be set
ETH_BRIDGE_PROXY_ADDRESS = "0x7F98B51517Af3D393e5C554d80CC1e2bCFA016d5"

# Optional: Override other config values
# MYS_RPC_URL = "http://fullnode.testnet.mysocial.network:8082"

# Bridge Node Configuration
BRIDGE_NODE_PORT = "8080"
BRIDGE_METRICS_PORT = "9090"

# Contract Addresses (Base Sepolia)
BRIDGE_COMMITTEE_ADDRESS = "0x9810cA587d88bCEB5c3727ed3e614fc802B5e995"
BRIDGE_CONFIG_ADDRESS = "0x99D4930D210c6BA9E64D22A8f36C34Cd698C24Ff"
BRIDGE_LIMITER_ADDRESS = "0x39071faF6d89fd1c2eFDB88Ad54fCD8F4D05f1f1"
BRIDGE_VAULT_ADDRESS = "0x0C3e42AEC99f65F1Ce9B94B3863c0170218abAad"

# Bridge Authority Configuration
BRIDGE_COMMITTEE_MEMBER = "true"

# Network Configuration
SOURCE_CHAIN_ID = "12"  # Base Sepolia
TARGET_CHAIN_ID = "2"      # Mys Network

# Monitoring and Logging
LOG_LEVEL = "info"
METRICS_ENABLED = "true"
PROMETHEUS_PORT = "9090"

# Performance Settings
SYNC_BATCH_SIZE = "100"
SYNC_INTERVAL_MS = "5000"
MAX_CONCURRENT_REQUESTS = "10"

# Security Settings
ENABLE_CORS = "true"
TRUSTED_PROXY_COUNT = "1"

# Feature Flags
ENABLE_EMERGENCY_PAUSE = "true"
ENABLE_RATE_LIMITING = "true"
ENABLE_TRANSFER_LIMITS = "true"
