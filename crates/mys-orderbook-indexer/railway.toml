[build]
builder = "dockerfile"
dockerfilePath = "crates/mys-orderbook-indexer/Dockerfile"

[deploy]
startCommand = "mys-orderbook-indexer"
healthcheckPath = "/"
healthcheckTimeout = 60

[variables]
# Optional: Logging configuration  
RUST_LOG = "info,mys_orderbook_indexer=debug"

# TLS Configuration - Uses rustls for secure connections
DATABASE_URL = "${{Postgres.DATABASE_URL}}"