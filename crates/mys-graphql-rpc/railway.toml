[build]
builder = "dockerfile"
dockerfilePath = "crates/mys-graphql-rpc/Dockerfile"

[deploy]
startCommand = "mys-graphql-rpc start-server --host 0.0.0.0 --port $PORT --db-url $DATABASE_URL --node-rpc-url http://fullnode.testnet.mysocial.network:8082 --ide-title 'MySocial Testnet GraphQL'"
healthcheckPath = "/"
healthcheckTimeout = 300

[variables]
# Logging configuration  
RUST_LOG = "info,mys_graphql_rpc=debug"
RUST_BACKTRACE = "1" 