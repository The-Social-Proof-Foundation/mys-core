[package]
name = "mys-bridge-relayer"
version = "0.1.0"
authors = ["The Social Proof Foundation, LLC. <brandon@socialproof.foundation>"]
license = "Apache-2.0"
publish = false
edition = "2021"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
bcs.workspace = true
bin-version.workspace = true
clap.workspace = true
diesel = { workspace = true, features = ["serde_json", "numeric"] }
diesel-async = { workspace = true, features = ["bb8", "postgres"] }
diesel_migrations = "2.2.0"
ethers = { version = "2.0", features = ["rustls", "ws"] }
fastcrypto.workspace = true
futures.workspace = true
bigdecimal.workspace = true
hex.workspace = true
mysten-metrics.workspace = true
once_cell.workspace = true
prometheus.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
tap.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
telemetry-subscribers.workspace = true

bip32 = { workspace = true, features = ["secp256k1"] }

mys-bridge.workspace = true
mys-config.workspace = true
mys-pg-db.workspace = true
mys-sdk.workspace = true
mys-types.workspace = true
mys-json-rpc-api.workspace = true
mys-json-rpc-types.workspace = true
mys-keys.workspace = true
shared-crypto.workspace = true
move-core-types.workspace = true

[dev-dependencies]
hex-literal = "0.3.4"

[[bin]]
name = "mys-bridge-relayer"
path = "src/main.rs"
