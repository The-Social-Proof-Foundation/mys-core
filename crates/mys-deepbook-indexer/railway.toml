[build]
builder = "dockerfile"
dockerfilePath = "crates/mys-deepbook-indexer/Dockerfile"

[deploy]
startCommand = "mys-deepbook-indexer"
healthcheckPath = "/"
healthcheckTimeout = 60

[variables]
# Optional: Logging configuration  
RUST_LOG = "info,mys_deepbook_indexer=debug"

# TLS Configuration - Uses rustls for secure connections
DATABASE_URL = "${{Postgres.DATABASE_URL}}"