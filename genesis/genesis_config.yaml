---
# Genesis configuration parameters
# This file controls the epoch duration and stake subsidy parameters

parameters:
  # Chain start timestamp current time + 0 hour (in milliseconds since epoch)
  chain_start_timestamp_ms: 1759674600 # 1759671685000

  # Protocol version
  protocol_version: 75  # Latest version

  # Whether to allow insertion of extra objects in genesis
  allow_insertion_of_extra_objects: true

  # Epoch duration in milliseconds (default: 24 hours)
  # 1 hour = 3,600,000 ms
  # 24 hours = 86,400,000 ms
  epoch_duration_ms: 14400000  # 4 hours for testnet (faster epochs)

  # Stake subsidy parameters
  #
  # When to start paying stake subsidies (0 = from beginning)
  stake_subsidy_start_epoch: 6

  # Initial stake subsidy distribution amount per epoch (in MIST)
  # Default: 538,626 MySo = 538,626,000,000,000 MIST
  stake_subsidy_initial_distribution_amount: 538626000000000

  # Number of epochs before decreasing the subsidy amount
  # Default: 15 epochs
  stake_subsidy_period_length: 3

  # Rate at which subsidy decreases at end of each period (in basis points)
  # 200 basis points = 2.0%
  stake_subsidy_decrease_rate: 200

# Accounts to add tokens to
accounts:
  # Faucet
  - address: "0xdceabe53f1bfea490497ad9b4942f2c2b095fc0f4378056b969417d889d6df08"
    gas_amounts:
      - 1000000000000000 # 1,000,000 MySo
  # Social Proof Foundation
  - address: "0x22e4e2b727f80d5a0a1763bc25e662ee1a0fe24a64e5bc89985b94b9d6c8f56a"
    gas_amounts:
      - 746200000000000000 # 746,200,000 MySo (24% from the Social Proof Foundation + 51% from the Community - 3 mill from Validators)
  # Core Team
  - address: "0x05a213d5cbdac80acc8e586b19bd67ca204f67bde4ae2e1893d8b10610864171"
    gas_amounts:
      - 249000000000000000 # 249,000,000 MySo (25% = 12.5% core + 12.5% marketing - 1 mill faucet)

